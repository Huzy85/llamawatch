[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llamawatch"
version = "0.6.0"
description = "Self-hosted ops dashboard for local LLMs"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{name = "Petru Huzur"}]
keywords = ["llm", "dashboard", "llama", "ollama", "monitoring", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.135",
    "starlette>=1.7.0",
    "anyio>=4.15.1",
    "httpx>=0.28",
    "uvicorn[standard]>=0.41",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "sse-starlette>=2.1",
    "aiofiles>=23.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
predictions = ["psycopg2-binary>=2.9"]
documents = ["pypdf>=4.0", "python-docx>=1.1"]
ui = ["playwright>=1.45", "pillow>=10"]
research = ["trafilatura>=2.0", "playwright>=1.45", "pypdf>=6.0"]

[project.scripts]
llamawatch = "llamawatch.__main__:main"

[project.urls]
Homepage = "https://github.com/Huzy85/llamawatch"
Issues = "https://github.com/Huzy85/llamawatch/issues"

[tool.setuptools.packages.find]
include = ["llamawatch*"]

[tool.setuptools.package-data]
llamawatch = ["static/**/*", "config.json"]

[tool.pytest.ini_options]
markers = ["ui: browser tests (run with: pytest -m ui tests/ui)"]
addopts = "-m 'not ui'"
